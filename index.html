<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Stats preview card component</title>
</head>
<body>

  <!-- Get insights that help your business grow.

  Discover the benefits of data analytics and make better decisions regarding revenue, customer 
  experience, and overall efficiency.

  10k+ companies
  314 templates
  12m+ queries -->
  <main class="card">
    <picture>
      <source srcset="./images/image-header-desktop.jpg" media="(width >= 768px)" >
      <img src="./images/image-header-mobile.jpg" alt="A group of students are talking and studying">
    </picture>
    <!----------- card wrapper: header, description, stats review  ----------->
    <div class="card-wrapper">
      <h2 class="card-header">Get <span class="highlight-words">insights</span> that help your business grow.</h2>
      <p class="card-info">Discover the benefits of data analytics and make better decisions regarding revenue, customer 
  experience, and overall efficiency.</p>
      <div class="stats-wrapper">
        <div class="stats-items">
          <span class="stats-number">10k+</span>
          <span class="stats-label">companies</span>
        </div>
        <div class="stats-items">
          <span class="stats-number">314</span>
          <span class="stats-label">templates</span>
        </div>
        <div class="stats-items">
          <span class="stats-number">12M+</span>
          <span class="stats-label">queries</span>
        </div>
      </div>
    </div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
